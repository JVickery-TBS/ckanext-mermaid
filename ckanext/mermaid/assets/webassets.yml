form-css:
  output: ckanext-mermaid/%(version)s_mermaid_form.css
  contents:
    - vendor/gridstack.css  # dist release; https://cdn.jsdelivr.net/npm/gridstack@14.0.0/dist/gridstack.min.css
    - mermaid_form.css

form-js:
  output: ckanext-mermaid/%(version)s_mermaid_form.js
  extra:
    preload:
      - base/main  # need jQuery
  contents:
    - vendor/gridstack.js  # dist release; https://cdn.jsdelivr.net/npm/gridstack@14.0.0/dist/gridstack-all.min.js
    - vendor/mermaid.js  # dist release; https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs
    - mermaid_form.js

view-css:
  output: ckanext-mermaid/%(version)s_mermaid_view.css
  contents:
    - vendor/gridstack.css  # dist release; https://cdn.jsdelivr.net/npm/gridstack@14.0.0/dist/gridstack.min.css
    - mermaid_view.css

view-js:
  output: ckanext-mermaid/%(version)s_mermaid_view.js
  extra:
    preload:
      - base/main  # need ckan JS and jQuery
  contents:
    - vendor/gridstack.js  # dist release; https://cdn.jsdelivr.net/npm/gridstack@14.0.0/dist/gridstack-all.min.js
    - vendor/mermaid.js  # dist release; https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs
    - mermaid_view.js

main-css:
  output: ckanext-mermaid/%(version)s_mermaid.css
  contents:
    - mermaid.css
